<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }
    h2 {
      color: #ff4500;
      margin-top: 0;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      background-color: #ff4500;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e03e00;
    }
    .secondary {
      background-color: #eee;
      color: #333;
    }
    .secondary:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2>Eye Buddy</h2>
  <p>Protégez vos yeux !</p>
  <button id="breakNow">Pause Immédiate</button>
  <button id="openOptions" class="secondary">Options</button>
  <script src="popup.js"></script>
</body>
</html>
